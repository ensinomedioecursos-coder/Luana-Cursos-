<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validação de Certificado - Luana Cursos</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f7;
  color: #222;
}

header {
  background: #071d3a;
  color: white;
  text-align: center;
  padding: 30px 15px;
  border-bottom: 5px solid #f5b900;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 25px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h2 {
  color: #071d3a;
  text-align: center;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #f5b900;
  color: #071d3a;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #dca600;
}

.resultado {
  margin-top: 25px;
  display: none;
  border-radius: 12px;
  padding: 20px;
}

.valido {
  display: block;
  background: #e9f8ed;
  border: 2px solid #2e9d50;
}

.invalido {
  display: block;
  background: #fff0f0;
  border: 2px solid #d33;
}

.valido h3 {
  color: #21863a;
}

.invalido h3 {
  color: #b00000;
}

.dado {
  padding: 8px 0;
  border-bottom: 1px solid #ddd;
}

.dado strong {
  color: #071d3a;
}

.codigo {
  font-family: monospace;
  font-weight: bold;
  font-size: 18px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #666;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>LUANA CURSOS</h1>
  <p>Consulta e validação de certificados</p>
</header>

<div class="container">

  <div class="card">

    <h2>🔎 Validar Certificado</h2>

    <p style="text-align:center;">
      Digite o código de validação informado no certificado.
    </p>

    <label for="codigo">Código de validação</label>

    <input
      type="text"
      id="codigo"
      placeholder="Ex.: LC-2026-00001"
      autocomplete="off"
    >

    <button onclick="validarCertificado()">
      CONSULTAR CERTIFICADO
    </button>

    <div id="resultado" class="resultado"></div>

  </div>

</div>

<footer>
  © 2026 Luana Cursos — Sistema de consulta de certificados.
</footer>

<script>

const certificados = {

  "LC-2026-00001": {
    nome: "NOME DO ALUNO",
    curso: "Operador de Trator",
    carga: "600 horas",
    data: "24/09/2026",
    situacao: "Válido"
  },

  "LC-2026-00002": {
    nome: "NOME DO ALUNO",
    curso: "Curso Profissionalizante",
    carga: "50 horas",
    data: "24/09/2026",
    situacao: "Válido"
  }

};

function validarCertificado() {

  const campo = document.getElementById("codigo");
  const resultado = document.getElementById("resultado");

  const codigo = campo.value.trim().toUpperCase();

  resultado.className = "resultado";

  if (!codigo) {
    resultado.classList.add("invalido");

    resultado.innerHTML = `
      <h3>⚠️ Digite um código</h3>
      <p>Informe o código de validação do certificado.</p>
    `;

    return;
  }

  const certificado = certificados[codigo];

  if (certificado) {

    resultado.classList.add("valido");

    resultado.innerHTML = `
      <h3>✅ CERTIFICADO VÁLIDO</h3>

      <div class="dado">
        <strong>Nome:</strong><br>
        ${certificado.nome}
      </div>

      <div class="dado">
        <strong>Curso:</strong><br>
        ${certificado.curso}
      </div>

      <div class="dado">
        <strong>Carga horária:</strong><br>
        ${certificado.carga}
      </div>

      <div class="dado">
        <strong>Data de emissão:</strong><br>
        ${certificado.data}
      </div>

      <div class="dado">
        <strong>Situação:</strong><br>
        ${certificado.situacao}
      </div>

      <div class="dado">
        <strong>Códig
